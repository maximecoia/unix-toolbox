name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    build-and-test:
        name: ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        # A read error that is neither stopped on nor retried loops forever
        # under tests/read_fault.c. Without a limit, that bug would hold the
        # job for GitHub's default of six hours instead of failing it.
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Build and test
              run: make check
