name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    build-and-test:
        name: ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Build and test
              run: make check
